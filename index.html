 function tex(name,base,mark,step){const t=new BABYLON.DynamicTexture(name,{width:256,height:256},scene,false),x=t.getContext();x.fillStyle=base;x.fillRect(0,0,256,256);let seed=base.length*31+mark.length*17;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let i=0;i<1700;i++){x.globalAlpha=.04+rand()*.12;x.fillStyle=rand()>.5?'#fff':'#000';let a=rand()*256,b=rand()*256,s=1+rand()*3;x.fillRect(a,b,s,s)}x.globalAlpha=.18;x.strokeStyle=mark;x.lineWidth=1;for(let i=0;i<256;i+=step){x.beginPath();x.moveTo(i,0);x.lineTo(i,256);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(256,i);x.stroke()}x.globalAlpha=1;t.update(false);t.wrapU=t.wrapV=BABYLON.Texture.WRAP_ADDRESSMODE;t.uScale=t.vScale=5;return t}

\nfunction show(title,text,opts=[]){$('mt').textContent=title;$('mp').textContent=text;let a=$('ma');a.innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.textContent=o.label;if(o.primary)b.className='main';b.onclick=()=>{o.run();$('mb').classList.remove('open')};a.appendChild(b)});$('mb').classList.add('open')}
function worldMenu(){show('Explore the world','Travel between countries. Architecture colours and road conventions vary by location. NPCs are individuals, not stereotypes.',[{label:'Random country',primary:true,run:()=>travelCountry(COUNTRIES[Math.floor(Math.random()*COUNTRIES.length)])},...COUNTRIES.map(c=>({label:c[0],run:()=>travelCountry(c)}))])}\nfunction travelCountry(country){COUNTRY=country;places=[];cars=[];people=[];if(scene)scene.dispose();world();visualUpgrade();cam=scene.activeCamera;alex.position.set(-66,0,-27);S.journal.unshift('Travelled to '+COUNTRY[0]+'.');toast('Travelled to '+COUNTRY[0]+' · '+COUNTRY[2]+' · '+(COUNTRY[3]==='left'?'Left-hand':'Right-hand')+' traffic');hud()}\nfunction interact(p){if(!p){toast('Move closer to a labelled building to interact.');return}S.journal.unshift('Visited '+p.name+' on day '+S.day);if(p.kind==='home'){S.energy=Math.min(100,S.energy+25);S.health=Math.min(100,S.health+5);toast('Rested at home.')}else if(p.kind==='shop'){show(p.name,'Choose what to buy. Cash: ₹'+S.cash,[{label:'Buy food · ₹100',primary:true,run:()=>{if(S.cash>=100){S.cash-=100;S.energy=Math.min(100,S.energy+12);S.happy=Math.min(100,S.happy+3);toast('Food bought.')}else toast('Not enough cash.')}},{label:'Buy clothes · ₹500',run:()=>{if(S.cash>=500){S.cash-=500;S.rep=Math.min(100,S.rep+2);toast('New clothes bought.')}else toast('Not enough cash.')}}])}else if(p.kind==='work'){career()}else if(p.kind==='school'){S.energy=Math.max(0,S.energy-10);S.rep=Math.min(100,S.rep+4);toast('School attended. Reputation improved.')}else if(p.kind==='clinic'){S.health=Math.min(100,S.health+22);S.cash=Math.max(0,S.cash-150);toast('Clinic visit complete. Fee ₹150.')}else if(p.kind==='park'){S.happy=Math.min(100,S.happy+14);toast('A little time outdoors improved your mood.')}else if(p.kind==='sport'){S.happy=Math.min(100,S.happy+10);S.health=Math.min(100,S.health+4);S.energy=Math.max(0,S.energy-12);toast('Practice complete.')}else{show(p.name,'Explore this location and build your life. Your choices affect happiness, energy, cash and reputation.',[{label:'Explore',primary:true,run:()=>{S.happy=Math.min(100,S.happy+3);toast('Explored '+p.name)}}])}hud()}
function career(){show('Career & money','Current job: '+S.job+'. Earn money, build reputation and manage energy.',[{label:'Find part-time work',primary:true,run:()=>{S.job='Part-time worker';S.cash+=250;S.rep=Math.min(100,S.rep+1);toast('Found part-time work: +₹250')}},{label:'Work a shift · +₹650',run:()=>{S.job='Part-time worker';S.cash+=650;S.energy=Math.max(0,S.energy-22);S.happy=Math.max(0,S.happy-3);S.rep=Math.min(100,S.rep+2);S.journal.unshift('Worked a shift and earned ₹650.');toast('Shift complete: +₹650')}}])}
function life(){show('Life overview','Day '+S.day+' · Age '+S.age+' · Job '+S.job+'\nHealth '+S.health+'% · Energy '+S.energy+'% · Happiness '+S.happy+'% · Reputation '+S.rep+'\n\nJournal:\n'+S.journal.slice(0,6).join('\n'),[{label:'Rest',primary:true,run:()=>{S.energy=Math.min(100,S.energy+20);S.health=Math.min(100,S.health+3);S.day++;toast('Rested. A new day begins.')}},{label:'Exercise',run:()=>{S.energy=Math.max(0,S.energy-12);S.health=Math.min(100,S.health+5);S.happy=Math.min(100,S.happy+5);toast('Exercise complete.')}}])}
function toggleDrive(){if(driving){driving=false;alex.position.x=activeCar.root.position.x+2.5;alex.position.z=activeCar.root.position.z;cam.lockedTarget=alex;toast('Exited vehicle.')}else{let c=cars.slice().sort((a,b)=>BABYLON.Vector3.Distance(a.root.position,alex.position)-BABYLON.Vector3.Distance(b.root.position,alex.position))[0];if(c&&BABYLON.Vector3.Distance(c.root.position,alex.position)<7){activeCar=c;driving=true;cam.lockedTarget=c.root;toast('Driving: use movement pad. Press Drive to exit.')}else toast('Walk within 7 metres of a car first.')}hud()}
function save(){try{localStorage.setItem('life-earth-babylon',JSON.stringify({S,position:{x:alex.position.x,z:alex.position.z}}));toast('Game saved on this device.')}catch(e){toast('Save unavailable in this browser.')}}
function load(){try{let s=JSON.parse(localStorage.getItem('life-earth-babylon'));if(s){Object.assign(S,s.S);alex.position.x=s.position.x;alex.position.z=s.position.z;hud();return true}}catch(e){}return false}
function input(){addEventListener('keydown',e=>{if(e.code==='KeyE'||e.code==='Enter'){interact(near);e.preventDefault()}if(e.code==='KeyF')toggleDrive();if(e.code==='Escape')$('mb').classList.remove('open');keys[{KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'}[e.code]]=true;if(e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>{let k={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'}[e.code];if(k)keys[k]=false});document.querySelectorAll('[data-m]').forEach(b=>{let k=b.dataset.m;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});$('interact').onclick=()=>interact(near);$('life').onclick=life;$('career').onclick=career;$('drive').onclick=toggleDrive;$('map').onclick=worldMenu;$('save').onclick=save;$('close').onclick=()=>$('mb').classList.remove('open')}
function update(dt){clock+=dt;let f=(keys.f?1:0)-(keys.b?1:0),s=(keys.r?1:0)-(keys.l?1:0);if(f||s){let ang=Math.atan2(s,f),speed=(driving?13:5.5)*dt;if(driving){activeCar.root.position.x+=Math.sin(ang)*speed;activeCar.root.position.z+=Math.cos(ang)*speed;activeCar.root.rotation.y=ang;alex.position.copyFrom(activeCar.root.position)}else{alex.position.x+=Math.sin(ang)*speed;alex.position.z+=Math.cos(ang)*speed;alex.position.x=Math.max(-138,Math.min(138,alex.position.x));alex.position.z=Math.max(-122,Math.min(122,alex.position.z));alex.rotation.y=ang;S.energy=Math.max(0,S.energy-dt*.12)}}cars.forEach(c=>{if(c.ai){c.root.position.z+=c.dir*c.speed*dt;if(c.root.position.z>120)c.root.position.z=-120;if(c.root.position.z< -120)c.root.position.z=120}});people.forEach(p=>{if(p.lane<2){p.root.position.x=p.x;p.root.position.z=-112+((p.offset+112+clock*(p.lane===0?2.2:-1.8)+224)%224);p.root.rotation.y=p.lane===0?0:Math.PI}else{p.root.position.x=-128+((p.offset+128+clock*(p.lane===2?2:-1.7)+256)%256);p.root.position.z=p.lane===2?-10.7:10.7;p.root.rotation.y=p.lane===2?Math.PI/2:-Math.PI/2}});near=null;let dist=1e9;for(let p of places){let d=Math.hypot(alex.position.x-p.x,alex.position.z-p.z);if(d<p.r&&d<dist){near=p;dist=d}}$('hint').textContent=near?'Nearby: '+near.name+' · Interact':'Walk with arrows / WASD or the on-screen controls';hud()}
async function start(){try{if(!window.BABYLON)throw Error('Babylon.js could not load. Check your internet connection.');engine=new BABYLON.Engine(canvas,true,{stencil:true,adaptToDeviceRatio:true});engine.setHardwareScalingLevel(innerWidth<700?1.25:1);COUNTRY=COUNTRY||COUNTRIES[Math.floor(Math.random()*COUNTRIES.length)];world();visualUpgrade();input();engine.runRenderLoop(()=>{let dt=Math.min(engine.getDeltaTime()/1000,.05);update(dt);scene.render()});addEventListener('resize',()=>engine.resize());$('loading').style.display='none';if(!load())toast('Welcome to '+COUNTRY[0]+'. Explore, work, drive and build your life.')}catch(e){$('loadmsg').textContent='3D world failed to load: '+e.message;console.error(e)}}input();start();
